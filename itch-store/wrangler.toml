name = "itch"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[vars]
TELEGRAM_CHAT_ID = ""   # your Telegram chat ID (several allowed, separated by commas)
WHATSAPP = "213784371031"   # your WhatsApp number, no + sign

[[d1_databases]]
binding = "DB"
database_name = "itch-db"
database_id = "PASTE-NEW-DATABASE-ID-HERE"   # from: npx wrangler d1 create itch-db

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "itch-images"
