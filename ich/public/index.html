<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICH — Black &amp; White Essentials</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css">
<style>
header{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;transition:.5s var(--e)}header.s{background:#000c;backdrop-filter:blur(14px)}
header img{height:42px;mix-blend-mode:screen}nav a{color:#fff;text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-left:28px;opacity:.75;transition:.3s}nav a:hover{opacity:1}
.hero{height:100svh;min-height:560px;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden}
.bg{position:absolute;inset:-6% 0;background:url(/img/hero.jpg) center/cover;filter:grayscale(1) brightness(.34);will-change:transform}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 55%,#000)}
.hero div{position:relative;z-index:2;padding:0 5vw}.hero img{width:min(520px,78vw);margin:0 auto 18px;mix-blend-mode:screen;animation:up 1.4s var(--e) both}
.hero p{color:#bbb;letter-spacing:.3em;text-transform:uppercase;font-size:12px;margin-bottom:34px;animation:up 1.4s .2s var(--e) both}.hero .btn{animation:up 1.4s .4s var(--e) both;display:inline-block;text-decoration:none}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
section{padding:110px 5vw 70px}section h2{font-size:clamp(34px,5vw,56px);margin-bottom:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 22px}
.card{cursor:pointer;background:none;border:0;text-align:left}.ph{aspect-ratio:3/4;background:#111;overflow:hidden;position:relative}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--e),opacity .6s}
.ph img+img{opacity:0}.card:hover .ph img{transform:scale(1.06)}.card:hover .ph img+img{opacity:1}.card h3{font-family:Inter;font-size:14px;margin-top:14px;font-weight:500;letter-spacing:0}.card span{color:var(--mut)}
.sk{aspect-ratio:3/4;background:linear-gradient(100deg,#0d0d0d 30%,#1a1a1a 50%,#0d0d0d 70%) 0 0/300% 100%;animation:sh 1.4s infinite}@keyframes sh{to{background-position:-300% 0}}
.md{position:fixed;inset:0;z-index:50;background:#000d;backdrop-filter:blur(8px);display:none;overflow:auto;padding:4vh 4vw}.md.o{display:block}
.pn{max-width:980px;margin:auto;background:#050505;border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;animation:up .7s var(--e)}
.pn>.g{padding:20px}.big{aspect-ratio:3/4;object-fit:cover;width:100%;background:#111}.th{display:flex;gap:8px;margin-top:8px}.th img{width:56px;height:70px;object-fit:cover;cursor:pointer;opacity:.5}.th img.on{opacity:1}
.pn form,.pn>.f{padding:28px}.pn h2{font-size:34px;margin:0 0 4px}.x{float:right;background:none;border:0;font-size:28px;cursor:pointer}.ds{color:#aaa;margin:10px 0}.er{color:#ff8a8a;margin-top:10px;min-height:20px}
footer{border-top:1px solid var(--line);padding:60px 5vw;display:flex;justify-content:space-between;flex-wrap:wrap;gap:30px}footer img{height:48px;mix-blend-mode:screen}footer a{color:#fff;display:block;text-decoration:none;margin-top:6px}footer small{color:var(--mut)}
@media(max-width:760px){.pn{grid-template-columns:1fr}nav a{margin-left:16px}}
</style></head><body>
<header id="h"><img src="/img/logo.jpg" alt="ICH"><nav><a href="#shop">Shop</a><a href="#contact">Contact</a></nav></header>
<div class="hero"><div class="bg" id="bg"></div><div><img src="/img/logo.jpg" alt="ICH"><p>Black · White · Essentials</p><a class="btn" href="#shop">Shop the collection</a></div></div>
<section id="shop"><h2 class="rv">The Collection</h2><div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></section>
<footer id="contact"><div><img src="/img/logo.jpg" alt="ICH"><br><small>© ICH</small></div><div><small>CONTACT</small><a id="fp"></a><a id="fe"></a></div></footer>
<div class="md" id="md"></div>
<script>
const W="Adrar,Chlef,Laghouat,Oum El Bouaghi,Batna,Béjaïa,Biskra,Béchar,Blida,Bouira,Tamanrasset,Tébessa,Tlemcen,Tiaret,Tizi Ouzou,Alger,Djelfa,Jijel,Sétif,Saïda,Skikda,Sidi Bel Abbès,Annaba,Guelma,Constantine,Médéa,Mostaganem,M'Sila,Mascara,Ouargla,Oran,El Bayadh,Illizi,Bordj Bou Arréridj,Boumerdès,El Tarf,Tindouf,Tissemsilt,El Oued,Khenchela,Souk Ahras,Tipaza,Mila,Aïn Defla,Naâma,Aïn Témouchent,Ghardaïa,Relizane,El M'Ghair,El Menia,Ouled Djellal,Bordj Badji Mokhtar,Béni Abbès,Timimoun,Touggourt,Djanet,In Salah,In Guezzam".split(","),$=s=>document.querySelector(s);
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),L=s=>(s||"").split(",").map(x=>x.trim()).filter(Boolean),D=n=>Number(n).toLocaleString("fr-DZ")+" DA";
let P=[],cur,sz="",co="";
const ok=/^[\w-]{5,30}$/;
function pixels(s){
if(ok.test(s.fb_pixel)){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init',s.fb_pixel);fbq('track','PageView')}
if(ok.test(s.tiktok_pixel)){!function(w,d,t){w.TiktokAnalyticsObject=t;var q=w[t]=w[t]||[];q.methods=["page","track","identify"];q.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat([].slice.call(arguments,0)))}};for(var i=0;i<q.methods.length;i++)q.setAndDefer(q,q.methods[i]);q.load=function(e){var n=d.createElement("script");n.src="https://analytics.tiktok.com/i18n/pixel/events.js?sdkid="+e+"&lib="+t;n.async=!0;d.head.appendChild(n)};q.load(s.tiktok_pixel);q.page()}(window,document,'ttq')}}
fetch("/api/settings").then(r=>r.json()).then(s=>{pixels(s);for(const[k,id,h]of[["phone","fp","tel:"],["email","fe","mailto:"]]){const a=$("#"+id);s[k]?(a.textContent=s[k],a.href=h+s[k].replace(/\s/g,"")):a.remove()}}).catch(()=>{});
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&(e.target.classList.add("in"),io.unobserve(e.target))),{threshold:.12});
document.querySelectorAll(".rv").forEach(x=>io.observe(x));
fetch("/api/products").then(r=>r.json()).then(a=>{P=a;$("#grid").innerHTML=a.length?a.map((p,i)=>`<button class="card rv" style="transition-delay:${i%4*80}ms" onclick="openP(${p.id})"><div class="ph">${p.images.slice(0,2).map(u=>`<img src="${u}" alt="" loading="lazy">`).join("")}</div><h3>${E(p.name)}</h3><span>${D(p.price)}</span></button>`).join(""):"<p>New pieces arriving soon.</p>";document.querySelectorAll(".card").forEach(x=>io.observe(x))});
function openP(id){cur=P.find(p=>p.id==id);sz=co="";const S=L(cur.sizes),C=L(cur.colors);window.fbq&&fbq("track","ViewContent",{content_name:cur.name,value:cur.price,currency:"DZD"});window.ttq&&ttq.track("ViewContent");
$("#md").innerHTML=`<div class="pn"><div class="g"><img class="big" id="big" src="${cur.images[0]||""}" alt=""><div class="th">${cur.images.map((u,i)=>`<img src="${u}" class="${i?"":"on"}" onclick="big.src='${u}';document.querySelectorAll('.th img').forEach(x=>x.classList.toggle('on',x==this))">`).join("")}</div></div>
<form id="of"><button type="button" class="x" onclick="closeP()">×</button><h2>${E(cur.name)}</h2><b>${D(cur.price)}</b><p class="ds">${E(cur.description)}</p>
${C.length?`<label>Color</label><div class="chips" data-k="c">${C.map(c=>`<button type="button" class="chip">${E(c)}</button>`).join("")}</div>`:""}
${S.length?`<label>Size</label><div class="chips" data-k="s">${S.map(c=>`<button type="button" class="chip">${E(c)}</button>`).join("")}</div>`:""}
<label>Full name</label><input name="full_name" required maxlength="80"><label>Phone number</label><input name="phone" type="tel" inputmode="numeric" placeholder="05 / 06 / 07 …" required pattern="0[5-7][0-9]{8}">
<label>Wilaya</label><select name="wilaya" required><option value="">Choose…</option>${W.map((w,i)=>`<option>${String(i+1).padStart(2,"0")} - ${w}</option>`).join("")}</select><label>Comment</label><textarea name="comment" rows="2"></textarea>
<div class="er" id="er"></div><button class="btn" style="width:100%;margin-top:8px">Command</button></form></div>`;
document.querySelectorAll(".chips").forEach(g=>g.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");g.dataset.k=="s"?sz=b.textContent:co=b.textContent});
$("#of").onsubmit=async e=>{e.preventDefault();const er=$("#er");if(S.length&&!sz||C.length&&!co){er.textContent="Please choose "+(C.length&&!co?"a color":"a size")+".";return}
const btn=e.target.querySelector(".btn");btn.disabled=1;const d=Object.fromEntries(new FormData(e.target));
const r=await fetch("/api/orders",{method:"POST",body:JSON.stringify({...d,product_id:cur.id,size:sz,color:co})}).then(r=>r.json()).catch(()=>({error:"Network error"}));
if(r.ok){window.fbq&&fbq("track","Purchase",{content_name:cur.name,value:cur.price,currency:"DZD"});window.ttq&&ttq.track("PlaceAnOrder");$("#of").innerHTML=`<button type="button" class="x" onclick="closeP()">×</button><h2>Thank you.</h2><p class="ds">Your order is received. We will call you shortly to confirm.</p>`}else{er.textContent=r.error;btn.disabled=0}};
$("#md").classList.add("o");document.body.style.overflow="hidden"}
function closeP(){$("#md").classList.remove("o");document.body.style.overflow=""}
$("#md").onclick=e=>e.target.id=="md"&&closeP();addEventListener("keydown",e=>e.key=="Escape"&&closeP());
addEventListener("scroll",()=>{const y=scrollY;$("#h").classList.toggle("s",y>40);if(y<innerHeight)$("#bg").style.transform=`translateY(${y*.25}px) scale(${1+y/4000})`},{passive:true});
</script></body></html>
