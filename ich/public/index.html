<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICH — Black &amp; White Essentials</title>
<meta name="theme-color" content="#fbfaf8">
<script>try{if(localStorage.getItem("ich-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/store.css">
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js"></script>
</head><body>
<div class="pre" id="pre"><img src="/img/logo-mark.png" alt="ICH"></div>
<header id="hd"><nav><a class="cap ul" href="#shop">Collection</a></nav><a href="#top" data-top><img class="lg" src="/img/logo-mark.png" alt="ICH"></a>
<div class="rt"><a class="cap ul" href="#contact">Contact</a><button class="tg" id="tg" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button></div></header>

<section class="hero" id="top"><div class="bg" data-p><div class="bgi"></div></div>
<div class="hc"><span class="cap rise" style="--l:.2s">The Collection</span>
<h1><span class="ln"><span style="--l:.3s">Black &amp; white</span></span><span class="ln"><span style="--l:.45s"><em>essentials.</em></span></span></h1>
<a class="lk cap rise" style="--l:.8s" href="#shop">Discover<i></i></a></div></section>

<section class="stm"><p id="stm">Essentials, reduced to black and white.</p><span class="cap mut rv">ICH</span></section>

<section class="col" id="shop"><div class="sh rv"><span class="cap">The Collection</span><span class="cap mut" id="cnt"></span></div>
<div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></section>

<section class="band"><div class="bg" data-p><div class="bgi"></div></div><img class="bl rv" src="/img/logo.png" alt="ICH"></section>

<footer id="contact"><div class="fc" id="fcw"><span class="cap mut rv" style="margin-bottom:22px">Get in touch</span><a id="fp" class="rv"></a><a id="fe" class="rv"></a></div>
<div class="fb"><span class="cap mut">© ICH</span><a class="cap ul" href="#top" data-top>Back to top</a></div></footer>
<div class="md" id="md" data-lenis-prevent></div>

<script>
const W="Adrar,Chlef,Laghouat,Oum El Bouaghi,Batna,Béjaïa,Biskra,Béchar,Blida,Bouira,Tamanrasset,Tébessa,Tlemcen,Tiaret,Tizi Ouzou,Alger,Djelfa,Jijel,Sétif,Saïda,Skikda,Sidi Bel Abbès,Annaba,Guelma,Constantine,Médéa,Mostaganem,M'Sila,Mascara,Ouargla,Oran,El Bayadh,Illizi,Bordj Bou Arréridj,Boumerdès,El Tarf,Tindouf,Tissemsilt,El Oued,Khenchela,Souk Ahras,Tipaza,Mila,Aïn Defla,Naâma,Aïn Témouchent,Ghardaïa,Relizane,El M'Ghair,El Menia,Ouled Djellal,Bordj Badji Mokhtar,Béni Abbès,Timimoun,Touggourt,Djanet,In Salah,In Guezzam".split(","),$=s=>document.querySelector(s);
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),L=s=>(s||"").split(",").map(x=>x.trim()).filter(Boolean),D=n=>Number(n).toLocaleString("fr-DZ")+" DA",clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let P=[],cur,sz="",co="",lenis,modal=0;
const ok=/^[\w-]{5,30}$/,still=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* intro */
const pre=$("#pre");let seen=0;try{seen=sessionStorage.getItem("ich-in")}catch(e){}
const reveal=()=>{pre.classList.add("out");document.body.classList.add("ready");setTimeout(()=>pre.remove(),1500)};
if(seen){pre.remove();document.body.classList.add("ready")}else{try{sessionStorage.setItem("ich-in","1")}catch(e){}const t0=performance.now(),fire=()=>setTimeout(reveal,Math.max(0,1400-(performance.now()-t0)));document.readyState==="complete"?fire():addEventListener("load",fire)}

/* smooth scroll (Lenis, falls back to native) */
addEventListener("load",()=>{if(window.Lenis&&!still){lenis=new Lenis({lerp:.085,wheelMultiplier:.9});const f=t=>{lenis.raf(t);requestAnimationFrame(f)};requestAnimationFrame(f)}});
const goTo=y=>lenis?lenis.scrollTo(y,{duration:1.8,easing:t=>1-Math.pow(1-t,4)}):scrollTo({top:typeof y=="number"?y:y.getBoundingClientRect().top+scrollY,behavior:"smooth"});
document.querySelectorAll('a[href^="#"]').forEach(a=>a.onclick=e=>{e.preventDefault();const t=a.hasAttribute("data-top")?0:$(a.getAttribute("href"));if(t!=null)goTo(t)});

/* theme */
$("#tg").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"?"light":"dark";r.classList.add("tt");r.dataset.theme=d;try{localStorage.setItem("ich-theme",d)}catch(e){}$('meta[name=theme-color]').content=d=="dark"?"#0a0a0a":"#fbfaf8";setTimeout(()=>r.classList.remove("tt"),700)};

/* scroll-driven: header, parallax, statement words */
const sp=$("#stm");sp.innerHTML=sp.textContent.split(" ").map(w=>`<span class="w">${w}</span>`).join(" ");
const words=[...document.querySelectorAll(".w")],par=[...document.querySelectorAll("[data-p]")],hd=$("#hd");let last=0;
function tick(){const y=scrollY,vh=innerHeight;hd.classList.toggle("s",y>30);
if(!modal){if(y>280&&y>last+6)hd.classList.add("hide");else if(y<last-6||y<280)hd.classList.remove("hide")}last=y;
if(!still){par.forEach(el=>{const r=el.parentElement.getBoundingClientRect();if(r.bottom<0||r.top>vh)return;el.style.transform=`translate3d(0,${(r.top+r.height/2-vh/2)*-.08}px,0)`});
const r=sp.getBoundingClientRect();if(r.bottom>0&&r.top<vh){const t=clamp((vh*.85-r.top)/(vh*.5),0,1);words.forEach((w,i)=>w.style.opacity=.14+.86*clamp(t*words.length-i,0,1))}}
requestAnimationFrame(tick)}tick();

/* tracking pixels */
function pixels(s){
if(ok.test(s.fb_pixel)){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init',s.fb_pixel);fbq('track','PageView')}
if(ok.test(s.tiktok_pixel)){!function(w,d,t){w.TiktokAnalyticsObject=t;var q=w[t]=w[t]||[];q.methods=["page","track","identify"];q.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat([].slice.call(arguments,0)))}};for(var i=0;i<q.methods.length;i++)q.setAndDefer(q,q.methods[i]);q.load=function(e){var n=d.createElement("script");n.src="https://analytics.tiktok.com/i18n/pixel/events.js?sdkid="+e+"&lib="+t;n.async=!0;d.head.appendChild(n)};q.load(s.tiktok_pixel);q.page()}(window,document,'ttq')}}
fetch("/api/settings").then(r=>r.json()).then(s=>{pixels(s);for(const[k,id,h]of[["phone","fp","tel:"],["email","fe","mailto:"]]){const a=$("#"+id);s[k]?(a.textContent=s[k],a.href=h+s[k].replace(/\s/g,"")):a.remove()}if(!s.phone&&!s.email)$("#fcw").remove()}).catch(()=>{});

/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&(e.target.classList.add("in"),io.unobserve(e.target))),{threshold:.1,rootMargin:"0px 0px -6% 0px"});
const watch=()=>document.querySelectorAll(".rv:not(.in),.card:not(.in)").forEach(x=>io.observe(x));watch();

/* collection */
fetch("/api/products").then(r=>r.json()).then(a=>{P=a;$("#cnt").textContent=a.length?"("+String(a.length).padStart(2,"0")+")":"";
$("#grid").innerHTML=a.length?a.map((p,i)=>`<button class="card" style="--d:${i%3*140}ms" onclick="openP(${p.id})"><div class="ph">${p.images.slice(0,2).map(u=>`<img src="${u}" alt="" loading="lazy">`).join("")}<span class="vw cap">View piece</span></div><div class="mt"><span class="no cap mut">N° ${String(i+1).padStart(2,"0")}</span><h3>${E(p.name)}</h3><span class="pr cap">${D(p.price)}</span></div></button>`).join(""):'<p class="empty">New pieces arriving soon.</p>';watch()}).catch(()=>{$("#grid").innerHTML='<p class="empty">Could not load the collection. Please refresh.</p>'});

/* product view + order form */
function sw(i,el){const b=$("#big");b.style.opacity=0;setTimeout(()=>{b.src=cur.images[i];b.style.opacity=1},300);document.querySelectorAll(".th img").forEach(x=>x.classList.toggle("on",x==el))}
function openP(id){cur=P.find(p=>p.id==id);sz=co="";const S=L(cur.sizes),C=L(cur.colors);window.fbq&&fbq("track","ViewContent",{content_name:cur.name,value:cur.price,currency:"DZD"});window.ttq&&ttq.track("ViewContent");
$("#md").innerHTML=`<div class="pn"><div class="gl"><img class="big" id="big" src="${cur.images[0]||""}" alt="">${cur.images.length>1?`<div class="th">${cur.images.map((u,i)=>`<img src="${u}" class="${i?"":"on"}" alt="" onclick="sw(${i},this)">`).join("")}</div>`:""}</div>
<form id="of" class="fm"><button type="button" class="x cap" onclick="closeP()">Close</button><h2>${E(cur.name)}</h2><div class="pp">${D(cur.price)}</div><p class="ds">${E(cur.description)}</p>
${C.length?`<label class="cap">Color</label><div class="chips" data-k="c">${C.map(c=>`<button type="button" class="chip">${E(c)}</button>`).join("")}</div>`:""}
${S.length?`<label class="cap">Size</label><div class="chips" data-k="s">${S.map(c=>`<button type="button" class="chip">${E(c)}</button>`).join("")}</div>`:""}
<label class="cap">Full name</label><input name="full_name" required maxlength="80"><label class="cap">Phone number</label><input name="phone" type="tel" inputmode="numeric" placeholder="05 / 06 / 07 …" required pattern="0[5-7][0-9]{8}">
<label class="cap">Wilaya</label><select name="wilaya" required><option value="">Choose…</option>${W.map((w,i)=>`<option>${String(i+1).padStart(2,"0")} - ${w}</option>`).join("")}</select><label class="cap">Comment</label><textarea name="comment" rows="2"></textarea>
<div class="er" id="er"></div><button class="btn cap">Order now</button></form></div>`;
document.querySelectorAll(".chips").forEach(g=>g.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");g.dataset.k=="s"?sz=b.textContent:co=b.textContent});
$("#of").onsubmit=async e=>{e.preventDefault();const er=$("#er");if(S.length&&!sz||C.length&&!co){er.textContent="Please choose "+(C.length&&!co?"a color":"a size")+".";return}
const btn=e.target.querySelector(".btn");btn.disabled=1;const d=Object.fromEntries(new FormData(e.target));
const r=await fetch("/api/orders",{method:"POST",body:JSON.stringify({...d,product_id:cur.id,size:sz,color:co})}).then(r=>r.json()).catch(()=>({error:"Network error"}));
if(r.ok){window.fbq&&fbq("track","Purchase",{content_name:cur.name,value:cur.price,currency:"DZD"});window.ttq&&ttq.track("PlaceAnOrder");$("#of").innerHTML=`<button type="button" class="x cap" onclick="closeP()">Close</button><h2>Thank you.</h2><p class="ds">Your order is received. We will call you shortly to confirm.</p>`}else{er.textContent=r.error;btn.disabled=0}};
$("#md").scrollTop=0;requestAnimationFrame(()=>$("#md").classList.add("o"));modal=1;lenis&&lenis.stop();document.body.style.overflow="hidden"}
function closeP(){$("#md").classList.remove("o");modal=0;lenis&&lenis.start();document.body.style.overflow=""}
addEventListener("keydown",e=>e.key=="Escape"&&closeP());
</script></body></html>
