<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICH — Black &amp; White Essentials</title>
<script>try{if(localStorage.getItem("ich-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css">
<style>
/* site-wide background: the same photo, softened by a theme overlay */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--ov),var(--ov)),url(/img/bg-soft.jpg) center/cover}
header{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;border-bottom:1px solid transparent;transition:.5s var(--e)}header.s{background:var(--hdr);backdrop-filter:blur(14px);border-color:var(--line)}
header .lg{height:30px;width:auto;filter:var(--logo)}.nv{display:flex;align-items:center;gap:6px}
nav a{color:var(--fg);text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-left:26px;opacity:.7;transition:.3s}nav a:hover{opacity:1}
.tg{margin-left:22px;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd2);background:none;cursor:pointer;display:grid;place-items:center;transition:transform .5s var(--e),background .3s}.tg:hover{transform:rotate(25deg) scale(1.06);background:var(--card)}
.tg svg{width:18px;height:18px;fill:none;stroke:var(--fg);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.tg .sun{display:none}:root[data-theme=dark] .tg .sun{display:block}:root[data-theme=dark] .tg .moon{display:none}
.hero{height:100svh;min-height:600px;position:relative;display:flex;align-items:center;overflow:hidden}
.bg{position:absolute;inset:-6% 0;will-change:transform}.bgi{position:absolute;inset:0;background:url(/img/hero.jpg) 65% center/cover;filter:var(--hero-f);animation:kb 2.6s var(--e) both}
@keyframes kb{from{transform:scale(1.14);opacity:0}to{transform:none;opacity:1}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--hl) 0,transparent 55%),linear-gradient(transparent 72%,var(--bg));pointer-events:none}
.hw{position:relative;z-index:2;padding:0 6vw;max-width:680px}.hw img{width:min(340px,68vw);margin:0 0 22px;filter:var(--logo);animation:up 1.4s .1s var(--e) both}
.hw p{opacity:.7;letter-spacing:.3em;text-transform:uppercase;font-size:12px;margin-bottom:34px;animation:up 1.4s .3s var(--e) both}.hw .btn{animation:up 1.4s .5s var(--e) both;display:inline-block;text-decoration:none}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
.mq{overflow:hidden;border-block:1px solid var(--line);background:var(--hdr);backdrop-filter:blur(8px);padding:14px 0;white-space:nowrap}.mq div{display:inline-block;animation:mq 28s linear infinite;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--mut)}@keyframes mq{to{transform:translateX(-50%)}}
section{padding:110px 5vw 70px}section h2{font-size:clamp(34px,5vw,56px);margin-bottom:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:38px 22px}
/* product entrance: staggered 3D rise + image wipe + zoom settle */
.card{cursor:pointer;background:none;border:0;text-align:left;color:inherit;opacity:0}
.card.in{opacity:1;animation:cardIn 1.1s var(--e) var(--d,0ms) backwards}
@keyframes cardIn{from{opacity:0;transform:perspective(1000px) translateY(90px) rotateX(-16deg) scale(.94);filter:blur(10px)}}
.ph{aspect-ratio:3/4;background:var(--card);overflow:hidden;position:relative;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s ease-out;will-change:transform}
.card.in .ph{animation:wipe 1.3s var(--e) var(--d,0ms) backwards}@keyframes wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--e),opacity .6s}
.card.in .ph img:first-child{animation:zoom 1.8s var(--e) var(--d,0ms) backwards}@keyframes zoom{from{transform:scale(1.45)}}
.ph img+img{opacity:0}.card:hover .ph img{transform:scale(1.06)}.card:hover .ph img+img{opacity:1}
.ph:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.34),transparent 55%)}.card:hover .ph:after{opacity:1}
.card h3,.card span{display:block}.card h3{font-family:Inter;font-size:14px;margin-top:14px;font-weight:500;letter-spacing:0}.card span{color:var(--mut)}
.card.in h3,.card.in span{animation:txt .9s var(--e) calc(var(--d,0ms) + .55s) backwards}@keyframes txt{from{opacity:0;transform:translateY(14px)}}
.sk{aspect-ratio:3/4;background:linear-gradient(100deg,var(--sk1) 30%,var(--sk2) 50%,var(--sk1) 70%) 0 0/300% 100%;animation:sh 1.4s infinite}@keyframes sh{to{background-position:-300% 0}}
.md{position:fixed;inset:0;z-index:50;background:var(--scrim);backdrop-filter:blur(10px);display:none;overflow:auto;padding:4vh 4vw}.md.o{display:block}
.pn{max-width:980px;margin:auto;background:var(--panel);border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;animation:up .7s var(--e);box-shadow:0 30px 80px #0002}
.pn>.g{padding:20px}.big{aspect-ratio:3/4;object-fit:cover;width:100%;background:var(--card)}.th{display:flex;gap:8px;margin-top:8px}.th img{width:56px;height:70px;object-fit:cover;cursor:pointer;opacity:.5;transition:opacity .3s}.th img.on{opacity:1}
.pn form,.pn>.f{padding:28px}.pn h2{font-size:34px;margin:0 0 4px}.x{float:right;background:none;border:0;font-size:28px;cursor:pointer}.ds{color:var(--mut);margin:10px 0}.er{color:var(--err);margin-top:10px;min-height:20px}
footer{border-top:1px solid var(--line);background:var(--hdr);backdrop-filter:blur(8px);padding:60px 5vw;display:flex;justify-content:space-between;flex-wrap:wrap;gap:30px}footer img{height:40px;width:auto;filter:var(--logo)}footer a{color:var(--fg);display:block;text-decoration:none;margin-top:6px}footer small{color:var(--mut)}
@media(max-width:760px){.pn{grid-template-columns:1fr}nav a{margin-left:14px}.tg{margin-left:14px}.hero{align-items:flex-end;padding-bottom:12vh}.bgi{background-position:72% center}.hero:after{background:linear-gradient(transparent 30%,var(--bg) 96%)}}
</style></head><body>
<header id="h"><img class="lg" src="/img/logo-mark.png" alt="ICH"><div class="nv"><nav><a href="#shop">Shop</a><a href="#contact">Contact</a></nav>
<button class="tg" id="tg" aria-label="Toggle dark mode"><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>
<div class="hero"><div class="bg" id="bg"><div class="bgi"></div></div><div class="hw"><img src="/img/logo.png" alt="ICH"><p>Black · White · Essentials</p><a class="btn" href="#shop">Shop the collection</a></div></div>
<div class="mq"><div id="mq"></div></div>
<section id="shop"><h2 class="rv">The Collection</h2><div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></section>
<footer id="contact"><div><img src="/img/logo-mark.png" alt="ICH"><br><small>© ICH</small></div><div><small>CONTACT</small><a id="fp"></a><a id="fe"></a></div></footer>
<div class="md" id="md"></div>
<script>
const W="Adrar,Chlef,Laghouat,Oum El Bouaghi,Batna,Béjaïa,Biskra,Béchar,Blida,Bouira,Tamanrasset,Tébessa,Tlemcen,Tiaret,Tizi Ouzou,Alger,Djelfa,Jijel,Sétif,Saïda,Skikda,Sidi Bel Abbès,Annaba,Guelma,Constantine,Médéa,Mostaganem,M'Sila,Mascara,Ouargla,Oran,El Bayadh,Illizi,Bordj Bou Arréridj,Boumerdès,El Tarf,Tindouf,Tissemsilt,El Oued,Khenchela,Souk Ahras,Tipaza,Mila,Aïn Defla,Naâma,Aïn Témouchent,Ghardaïa,Relizane,El M'Ghair,El Menia,Ouled Djellal,Bordj Badji Mokhtar,Béni Abbès,Timimoun,Touggourt,Djanet,In Salah,In Guezzam".split(","),$=s=>document.querySelector(s);
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),L=s=>(s||"").split(",").map(x=>x.trim()).filter(Boolean),D=n=>Number(n).toLocaleString("fr-DZ")+" DA";
let P=[],cur,sz="",co="";
const ok=/^[\w-]{5,30}$/;
$("#mq").textContent=("BLACK · WHITE · ESSENTIALS · ").repeat(16);
$("#tg").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"?"light":"dark";r.classList.add("tt");r.dataset.theme=d;try{localStorage.setItem("ich-theme",d)}catch(e){}setTimeout(()=>r.classList.remove("tt"),600)};
function pixels(s){
if(ok.test(s.fb_pixel)){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init',s.fb_pixel);fbq('track','PageView')}
if(ok.test(s.tiktok_pixel)){!function(w,d,t){w.TiktokAnalyticsObject=t;var q=w[t]=w[t]||[];q.methods=["page","track","identify"];q.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat([].slice.call(arguments,0)))}};for(var i=0;i<q.methods.length;i++)q.setAndDefer(q,q.methods[i]);q.load=function(e){var n=d.createElement("script");n.src="https://analytics.tiktok.com/i18n/pixel/events.js?sdkid="+e+"&lib="+t;n.async=!0;d.head.appendChild(n)};q.load(s.tiktok_pixel);q.page()}(window,document,'ttq')}}
fetch("/api/settings").then(r=>r.json()).then(s=>{pixels(s);for(const[k,id,h]of[["phone","fp","tel:"],["email","fe","mailto:"]]){const a=$("#"+id);s[k]?(a.textContent=s[k],a.href=h+s[k].replace(/\s/g,"")):a.remove()}}).catch(()=>{});
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&(e.target.classList.add("in"),io.unobserve(e.target))),{threshold:.12,rootMargin:"0px 0px -40px 0px"});
document.querySelectorAll(".rv").forEach(x=>io.observe(x));
fetch("/api/products").then(r=>r.json()).then(a=>{P=a;$("#grid").innerHTML=a.length?a.map((p,i)=>`<button class="card" style="--d:${i%4*110}ms" onclick="openP(${p.id})"><div class="ph">${p.images.slice(0,2).map(u=>`<img src="${u}" alt="" loading="lazy">`).join("")}</div><h3>${E(p.name)}</h3><span>${D(p.price)}</span></button>`).join(""):"<p>New pieces arriving soon.</p>";
document.querySelectorAll(".card").forEach(c=>{io.observe(c);if(!matchMedia("(hover:hover) and (pointer:fine)").matches)return;const ph=c.querySelector(".ph"),set=(k,v)=>ph.style.setProperty(k,v);
c.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;set("--ry",(x-.5)*12+"deg");set("--rx",(.5-y)*12+"deg");set("--mx",x*100+"%");set("--my",y*100+"%")});
c.addEventListener("mouseleave",()=>{set("--rx","0deg");set("--ry","0deg")})})}).catch(()=>{$("#grid").innerHTML="<p>Could not load the collection. Please refresh.</p>"});
function openP(id){cur=P.find(p=>p.id==id);sz=co="";const S=L(cur.sizes),C=L(cur.colors);window.fbq&&fbq("track","ViewContent",{content_name:cur.name,value:cur.price,currency:"DZD"});window.ttq&&ttq.track("ViewContent");
$("#md").innerHTML=`<div class="pn"><div class="g"><img class="big" id="big" src="${cur.images[0]||""}" alt=""><div class="th">${cur.images.map((u,i)=>`<img src="${u}" class="${i?"":"on"}" onclick="big.src='${u}';document.querySelectorAll('.th img').forEach(x=>x.classList.toggle('on',x==this))">`).join("")}</div></div>
<form id="of"><button type="button" class="x" onclick="closeP()">×</button><h2>${E(cur.name)}</h2><b>${D(cur.price)}</b><p class="ds">${E(cur.description)}</p>
${C.length?`<label>Color</label><div class="chips" data-k="c">${C.map(c=>`<button type="button" class="chip">${E(c)}</button>`).join("")}</div>`:""}
${S.length?`<label>Size</label><div class="chips" data-k="s">${S.map(c=>`<button type="button" class="chip">${E(c)}</button>`).join("")}</div>`:""}
<label>Full name</label><input name="full_name" required maxlength="80"><label>Phone number</label><input name="phone" type="tel" inputmode="numeric" placeholder="05 / 06 / 07 …" required pattern="0[5-7][0-9]{8}">
<label>Wilaya</label><select name="wilaya" required><option value="">Choose…</option>${W.map((w,i)=>`<option>${String(i+1).padStart(2,"0")} - ${w}</option>`).join("")}</select><label>Comment</label><textarea name="comment" rows="2"></textarea>
<div class="er" id="er"></div><button class="btn" style="width:100%;margin-top:8px">Command</button></form></div>`;
document.querySelectorAll(".chips").forEach(g=>g.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");g.dataset.k=="s"?sz=b.textContent:co=b.textContent});
$("#of").onsubmit=async e=>{e.preventDefault();const er=$("#er");if(S.length&&!sz||C.length&&!co){er.textContent="Please choose "+(C.length&&!co?"a color":"a size")+".";return}
const btn=e.target.querySelector(".btn");btn.disabled=1;const d=Object.fromEntries(new FormData(e.target));
const r=await fetch("/api/orders",{method:"POST",body:JSON.stringify({...d,product_id:cur.id,size:sz,color:co})}).then(r=>r.json()).catch(()=>({error:"Network error"}));
if(r.ok){window.fbq&&fbq("track","Purchase",{content_name:cur.name,value:cur.price,currency:"DZD"});window.ttq&&ttq.track("PlaceAnOrder");$("#of").innerHTML=`<button type="button" class="x" onclick="closeP()">×</button><h2>Thank you.</h2><p class="ds">Your order is received. We will call you shortly to confirm.</p>`}else{er.textContent=r.error;btn.disabled=0}};
$("#md").classList.add("o");document.body.style.overflow="hidden"}
function closeP(){$("#md").classList.remove("o");document.body.style.overflow=""}
$("#md").onclick=e=>e.target.id=="md"&&closeP();addEventListener("keydown",e=>e.key=="Escape"&&closeP());
addEventListener("scroll",()=>{const y=scrollY;$("#h").classList.toggle("s",y>40);if(y<innerHeight)$("#bg").style.transform=`translateY(${y*.22}px)`},{passive:true});
</script></body></html>
