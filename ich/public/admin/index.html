<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ICH Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css">
<style>
.lg{max-width:360px;margin:12vh auto;padding:0 20px}.lg img{width:200px;mix-blend-mode:screen;margin:0 auto 20px}.lg .btn{width:100%;margin-top:18px}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}aside{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}aside img{width:120px;mix-blend-mode:screen;margin-bottom:24px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;cursor:pointer;color:#999;transition:.3s}aside button.on,aside button:hover{color:#fff;background:#141414}
main{padding:30px 4vw;max-width:1000px;overflow:auto}main h2{font-size:34px;margin-bottom:22px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}.bx{border:1px solid var(--line);padding:18px;background:var(--card);margin-bottom:14px}.k b{font-size:30px;font-family:"Cormorant Garamond",serif;display:block}
.r{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.r i{display:block;height:8px;background:#fff;min-width:3px;transition:width 1s var(--e)}.r span{width:130px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}.row img{width:48px;height:60px;object-fit:cover}
.imgs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.imgs img{width:70px;height:88px;object-fit:cover;cursor:pointer}.m{color:#7fdc9a;font-size:13px;min-height:18px}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}aside img{display:none}aside button{width:auto}.k{grid-template-columns:1fr}.ov{overflow:auto}}
</style></head><body><div id="v"></div><script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const A=async(u,m="GET",b)=>{const r=await fetch("/api/admin/"+u,{method:m,body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status==401&&u!="login")init();return j};
const T={dash:"Dashboard",orders:"Orders",products:"Products",settings:"Settings"};let me,tab="dash",ed=null;
async function init(){const r=await A("me");me=r.me;if(me)return shell();$("#v").innerHTML=`<form class="lg" id="lf"><img src="/img/logo.jpg"><label>Password</label><input name="password" type="password" required autofocus><div class="er" id="er" style="color:#ff8a8a;margin-top:10px"></div><button class="btn">Sign in</button></form>`;
$("#lf").onsubmit=async e=>{e.preventDefault();const l=await A("login","POST",Object.fromEntries(new FormData(e.target)));l.error?$("#er").textContent=l.error:init()}}
function shell(){$("#v").innerHTML=`<div class="app"><aside><img src="/img/logo.jpg">${Object.entries(T).map(([k,v])=>`<button data-t="${k}" class="${k==tab?"on":""}">${v}</button>`).join("")}<button id="lo" style="margin-top:20px">Sign out</button></aside><main id="mn"></main></div>`;
document.querySelectorAll("aside [data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;ed=null;shell()});$("#lo").onclick=async()=>{await A("logout","POST");init()};R[tab]()}
const R={
async dash(){const s=await A("stats"),bars=(a,t)=>{const m=Math.max(1,...a.map(x=>x.c));return`<div class="bx"><b style="font-size:13px;color:#999;font-weight:500">${t}</b>${a.map(x=>`<div class="r"><span>${E(x.n)}</span><i style="width:${x.c/m*55}%"></i>${x.c}</div>`).join("")||"<p style=color:#666>No data yet</p>"}</div>`};
$("#mn").innerHTML=`<h2>Dashboard</h2><div class="k"><div class="bx"><b>${s.total.c}</b>Orders</div><div class="bx"><b>${s.total.n||0}</b>New / unconfirmed</div><div class="bx"><b>${Number(s.total.r).toLocaleString("fr-DZ")}</b>Revenue (DA)</div></div>${bars(s.products,"Best-selling products")}${bars(s.wilayas,"Top wilayas")}${bars(s.days,"Orders · last 14 days")}`},
async orders(){const o=await A("orders"),st=["new","confirmed","shipped","delivered","cancelled"];$("#mn").innerHTML=`<h2>Orders</h2><div class="ov"><table><tr><th>#<th>Customer<th>Product<th>Wilaya<th>Status</tr>${o.map(x=>`<tr><td>${x.id}<td>${E(x.full_name)}<br><a style="color:#aaa" href="tel:${E(x.phone)}">${E(x.phone)}</a>${x.comment?`<br><small style=color:#777>${E(x.comment)}</small>`:""}<td>${E(x.product_name)}<br><small style=color:#888>${E(x.color)} ${E(x.size)} · ${x.price} DA</small><td>${E(x.wilaya)}<td><select data-o="${x.id}" style="width:auto">${st.map(s=>`<option ${s==x.status?"selected":""}>${s}</option>`).join("")}</select></tr>`).join("")}</table></div>`;
document.querySelectorAll("[data-o]").forEach(s=>s.onchange=()=>A("orders/"+s.dataset.o,"PATCH",{status:s.value}))},
async products(){if(ed)return form();const p=await A("products");window._p=p;$("#mn").innerHTML=`<h2>Products</h2><button class="btn" id="np">+ Add product</button><div style="margin-top:20px">${p.map(x=>`<div class="row"><div style="display:flex;gap:12px;align-items:center"><img src="${x.images[0]||""}"><div>${E(x.name)}<br><small style=color:#888>${x.price} DA ${x.active?"":"· hidden"}</small></div></div><div><button class="btn o" data-e="${x.id}">Edit</button> <button class="btn o" data-d="${x.id}">Delete</button></div></div>`).join("")}</div>`;
$("#np").onclick=()=>{ed={images:[],active:1};R.products()};document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{ed=window._p.find(x=>x.id==b.dataset.e);R.products()});document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this product?")){await A("products/"+b.dataset.d,"DELETE");R.products()}})},
async settings(){const s=await A("settings"),f=(k,l,h="")=>`<label>${l}</label><input name="${k}" value="${E(s[k])}" placeholder="${h}">`;$("#mn").innerHTML=`<h2>Settings</h2><form id="sf" style="max-width:460px"><b>Footer text</b>${f("footer_text","Short description","Black &amp; white essentials.")}<br><br><b>Footer contact</b>${f("phone","Phone","0555 00 00 00")}${f("email","Email","contact@…")}${f("whatsapp","WhatsApp number","0555 00 00 00")}${f("address","Address","Oran, Algeria")}<br><br><b>Footer social links</b>${f("instagram","Instagram (username or link)","ich.store")}${f("facebook","Facebook (page name or link)")}${f("tiktok","TikTok (username or link)")}<br><br><b>Tracking</b>${f("fb_pixel","Facebook Pixel ID")}${f("tiktok_pixel","TikTok Pixel ID")}<br><br><button class="btn">Save</button> <span class="m" id="m"></span></form>`;
$("#sf").onsubmit=async e=>{e.preventDefault();await A("settings","POST",Object.fromEntries(new FormData(e.target)));$("#m").textContent="Saved ✓"}}
};
const rs=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.75))};i.src=URL.createObjectURL(f)});
function form(){const p=ed,im=()=>$("#im").innerHTML=p.images.map((u,i)=>`<img src="${u}" title="Click to remove" data-i="${i}">`).join("");
$("#mn").innerHTML=`<h2>${p.id?"Edit":"New"} product</h2><form id="pf" style="max-width:520px"><label>Name</label><input name="name" required value="${E(p.name)}"><label>Price (DA)</label><input name="price" type="number" required value="${p.price||""}"><label>Description</label><textarea name="description" rows="5">${E(p.description)}</textarea><label>Sizes (comma separated)</label><input name="sizes" placeholder="S, M, L, XL" value="${E(p.sizes)}"><label>Colors (comma separated)</label><input name="colors" placeholder="Black, White" value="${E(p.colors)}"><label>Pictures (max 5 · first is the cover)</label><input type="file" id="fi" accept="image/*" multiple><div class="imgs" id="im"></div><label><input type="checkbox" name="active" ${p.active?"checked":""} style="width:auto"> Visible in shop</label><br><button class="btn">Save</button> <button type="button" class="btn o" id="cx">Cancel</button></form>`;im();
$("#im").onclick=e=>{if(e.target.dataset.i){p.images.splice(e.target.dataset.i,1);im()}};$("#fi").onchange=async e=>{for(const f of e.target.files)if(p.images.length<5)p.images.push(await rs(f));im()};$("#cx").onclick=()=>{ed=null;R.products()};
$("#pf").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await A("products","POST",{...d,id:p.id,active:!!d.active,images:p.images});ed=null;R.products()}}
init();</script></body></html>
